<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>场馆排班列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <style>
    :root {
      --brand: #ad3004;
      --brand-deep: #7f1f00;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #666;
      --border: #d9d9d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, rgba(173, 48, 4, 0.82), rgba(127, 31, 0, 0.85));
      color: var(--text);
      padding: 14px 12px 20px;
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-top: max(16px, env(safe-area-inset-top));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    .page {
      width: 100%;
      margin: 0 auto;
      max-width: 680px;
    }
    .page-shell {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 8px 8px 10px;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.14);
    }
    .venue-card {
      background: var(--card);
      border-radius: 11px;
      padding: 22px 10px 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.58);
    }
    .venue-card:last-child {
      margin-bottom: 0;
    }
    .board-title {
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
      line-height: 1.22;
    }
    .board-title-main {
      display: block;
      font-size: 25px;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .board-title-sub {
      display: block;
      margin-top: 2px;
      font-size: 21px;
      letter-spacing: 0.4px;
      font-weight: 500;
    }
    .board-subtitle {
      text-align: center;
      color: var(--brand);
      font-size: 16px;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }
    .schedule-table-wrap {
      border: 1px solid #a6a6a6;
      border-radius: 9px;
      overflow: hidden;
      background: #fff;
    }
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .schedule-table thead th {
      background: rgba(173, 48, 4, 0.78);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.25);
    }
    .schedule-table thead th:last-child {
      border-right: none;
    }
    .schedule-table th:first-child,
    .schedule-table td:first-child {
      width: 29%;
      text-align: center;
      border-right: 1px solid #a3a3a3;
    }
    .schedule-table td {
      border-top: 1px solid #a3a3a3;
      padding: 16px 8px;
      color: #444;
      font-size: 14px;
      text-align: center;
      line-height: 1.65;
      vertical-align: middle;
      word-break: break-word;
    }
    .schedule-table tbody tr:nth-child(even) td {
      background: #edf2f5;
    }
    .hall-name {
      font-weight: 600;
      color: #505050;
    }
    .hall-time {
      color: #444;
      font-weight: 500;
    }
    .warm-tip {
      margin-top: 14px;
      padding: 10px 8px 2px;
      border-top: 1px solid #efefef;
      font-size: 12px;
      color: #9b9b9b;
      line-height: 1.7;
    }
    .no-schedule-msg {
      font-size: 14px;
      color: #777;
      padding: 20px 12px;
      text-align: center;
      border: 1px dashed #d2d2d2;
      border-radius: 8px;
      background: #fafafa;
      margin-top: 8px;
    }
    .empty, .loading, .error {
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
      color: #f5f5f5;
      line-height: 1.6;
    }
    .error { color: #ffd7d2; }

    @media (max-width: 375px) {
      .venue-card {
        padding: 18px 8px 10px;
      }
      .board-title {
        margin-bottom: 7px;
      }
      .board-title-main {
        font-size: 21px;
      }
      .board-title-sub {
        font-size: 17px;
      }
      .board-subtitle {
        font-size: 15px;
      }
      .schedule-table thead th {
        font-size: 14px;
        padding: 10px 6px;
      }
      .schedule-table td {
        font-size: 13px;
        padding: 12px 6px;
      }
    }
    @media (max-width: 320px) {
      .board-title-main {
        font-size: 19px;
      }
      .board-title-sub {
        font-size: 16px;
      }
      .schedule-table td,
      .schedule-table thead th {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="page-shell">
  <div id="statusContainer"></div>
  <div id="venueContainer"></div>
  </div>
</div>

<script>

              ]

          ],

            { id: 201, floor_text: "未知", activity_name: "海派旗袍特展", start_time: "09:45" },

          ],

          is_today: false,
          no_schedule_message: "今日该场馆暂无志愿者导览安排，可查看后续日期。"
        }
      ],
      total_count: 16,
      start_date: "2026-06-26",
      end_date: "2026-06-29"
    },
    error: ""
  };

  function getToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }


  function formatTime(s) {
    if (!s) return "--";
    const parts = String(s).split(":");
    if (parts.length >= 2) return `${parts[0]}:${parts[1]}`;
    return s;
  }

  function formatDateCn(dateStr) {
    if (!dateStr) return "--";
    const [y, m, d] = String(dateStr).split("-");
    if (!y || !m || !d) return dateStr;
    return `${y}年${m}月${d}日`;
  }

  function getGroupDisplayName(group) {
    const title = String(
      (group && (group.group_name || group.floor_text || group.activity_name)) || ""
    ).trim();
    return title || "未命名分组";
  }

  function normalizeFloorGroup(group) {
    const schedules = Array.isArray(group && group.schedules) ? group.schedules : [];
    const scheduleCount = Number(group && group.schedule_count);

    return {
      groupName: getGroupDisplayName(group),
      groupType: (group && group.group_type) || "",
      groupKey: (group && group.group_key) || getGroupDisplayName(group),
      schedules,
      scheduleCount: Number.isFinite(scheduleCount) ? scheduleCount : schedules.length
    };
  }

  function normalizeDaySchedule(day) {
    const floorGroups = Array.isArray(day && day.floor_groups)
      ? day.floor_groups.map(normalizeFloorGroup)
      : [];
    const fallbackSchedules = Array.isArray(day && day.schedules) ? day.schedules : [];
    const mergedGroups = floorGroups.length
      ? floorGroups
      : (fallbackSchedules.length ? [{
          groupName: "全部排班",
          groupType: "",
          groupKey: "all",
          schedules: fallbackSchedules,
          scheduleCount: fallbackSchedules.length
        }] : []);
    const hasSchedules = typeof (day && day.has_schedules) === "boolean"
      ? day.has_schedules
      : mergedGroups.some((group) => group.schedules.length > 0);

    return {
      date: day && day.date,
      dayOfWeek: day && day.day_of_week,
      floorGroups: mergedGroups,
      hasSchedules,
      message: (day && day.no_schedule_message) || "今日该场馆暂无导览排班"
    };
  }

  function mergeVenueDailySchedules(venues) {
    const mergedByDate = new Map();

    (venues || []).forEach((venue) => {
      (venue.daily_schedules || []).forEach((day) => {
        const dayKey = `${day.date || ""}|${day.day_of_week || ""}`;

        if (!mergedByDate.has(dayKey)) {
          mergedByDate.set(dayKey, {
            date: day.date,
            day_of_week: day.day_of_week,
            floor_groups: [],
            schedules: [],
            has_schedules: false,
            no_schedule_message: day.no_schedule_message || null
          });
        }

        const mergedDay = mergedByDate.get(dayKey);

        if (Array.isArray(day.floor_groups) && day.floor_groups.length) {
          mergedDay.floor_groups.push(...day.floor_groups);
          mergedDay.has_schedules = true;
        }

        if (Array.isArray(day.schedules) && day.schedules.length) {
          mergedDay.schedules.push(...day.schedules);
          mergedDay.has_schedules = true;
        }

        if (!mergedDay.no_schedule_message && day.no_schedule_message) {
          mergedDay.no_schedule_message = day.no_schedule_message;
        }
      });
    });

    return Array.from(mergedByDate.values());
  }

  function buildRequestPayload(start_date, end_date) {
    return {
      // 兼容新版 ListParams
      page_no: 1,
      page_size: 20,
      filter_items: {},
      search_items: {},
      time_items: {},
      join_items: {},
      order_by_items: {},
      none_items: {},
      or_items: {},
      custom_items: { start_date, end_date },
      is_page: false,
      is_count: false,
      is_sum: false,
      fields_to_sum: [],
      // 兼容旧版直传参数
      start_date,
      end_date
    };
  }

  function extractDailySchedules(json) {
    // success 字段不存在时，按成功处理；仅在明确 false 时抛错
    if (json && json.success === false) {
      throw new Error(json.error || json.message || "接口返回错误");
    }

    const data = (json && (json.data || json.result)) || json || {};

    if (Array.isArray(data.daily_schedules)) return data.daily_schedules;
    if (Array.isArray(data.venues)) return mergeVenueDailySchedules(data.venues);
    if (Array.isArray(data)) return mergeVenueDailySchedules(data);
    if (Array.isArray(data.list)) return data.list;
    if (Array.isArray(data.items)) return data.items;
    if (Array.isArray(data.records)) return data.records;

    return [];
  }

  async function fetchAllVenues() {
    const today = getToday();
    const start_date = today;
    const end_date = today;

    const statusContainer = document.getElementById("statusContainer");
    const venueContainer = document.getElementById("venueContainer");
    statusContainer.innerHTML = `<div class="loading">加载中...</div>`;
    venueContainer.innerHTML = "";

    try {
      let json;
      if (USE_MOCK) {
        json = MOCK_RESPONSE;
      } else {
        const res = await fetch(API_BASE + API_PATH, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildRequestPayload(start_date, end_date))
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        json = await res.json();
      }
      const dailySchedules = extractDailySchedules(json);

      statusContainer.innerHTML = "";

      if (!dailySchedules.length) {
        venueContainer.innerHTML = `<div class="empty">今日暂无场馆排班</div>`;
        return;
      }

      venueContainer.innerHTML = dailySchedules.map((day) => {
        const normalizedDay = normalizeDaySchedule(day);
        const dateText = formatDateCn(normalizedDay.date || today);
        const hallRows = normalizedDay.floorGroups.map((group) => {
          const times = (group.schedules || [])
            .map((schedule) => formatTime(schedule.start_time))
            .filter((time) => time && time !== "--");
          const uniqueTimes = [...new Set(times)];

          return {
            hall: group.groupName,
            times: uniqueTimes.length ? uniqueTimes.join("、 ") : "--"
          };
        });

        const rowsHtml = hallRows.length
          ? hallRows
            .map((row) => `
              <tr>
                <td class="hall-name">${row.hall}</td>
                <td class="hall-time">${row.times}</td>
              </tr>
            `).join("")
          : "";

        return `
          <div class="venue-card">
            <div class="board-title">
              <span class="board-title-main">上海市历史博物馆</span>
              <span class="board-title-sub">志愿者展厅导览时间</span>
            </div>
            <div class="board-subtitle">${dateText}</div>
            ${hallRows.length ? `
              <div class="schedule-table-wrap">
                <table class="schedule-table">
                  <thead>
                    <tr>
                      <th>楼层/特展</th>
                      <th>志愿者导览时间</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                  </tbody>
                </table>
              </div>
            ` : `<div class="no-schedule-msg">${normalizedDay.message}</div>`}
            <div class="warm-tip">温馨提示：以上为展览开始时间，如遇不可抗因素取消敬请谅解。</div>
          </div>`;
      }).join("");
    } catch (error) {
      statusContainer.innerHTML = `<div class="error">加载失败：${error.message}</div>`;
    }
  }

  document.addEventListener("DOMContentLoaded", fetchAllVenues);
</script>
</body>
</html>
